name: Flovia manual PoC

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Status-only diagnosis, or later status and tool-list check
        type: choice
        required: true
        default: status-only
        options:
          - status-only
          - check

permissions:
  contents: read

concurrency:
  group: flovia-manual-poc
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flovia/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: flovia
      - run: npm test
        working-directory: flovia
      # Only this step receives the key. Never use shell tracing or print env.
      - name: Read the selected status mode without a data lookup
        run: |
          case "$FLOVIA_MODE" in
            status-only) npm run status-only ;;
            check) npm run check ;;
            *) echo "Unsupported Flovia mode" >&2; exit 1 ;;
          esac
        working-directory: flovia
        env:
          FLOVIA_KEY: ${{ secrets.FLOVIA_API_KEY }}
          FLOVIA_MODE: ${{ inputs.mode || 'status-only' }}
      - name: Save sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flovia-poc-${{ github.run_id }}-${{ github.run_attempt }}
          path: flovia/results/report.json
          if-no-files-found: warn
          retention-days: 7
