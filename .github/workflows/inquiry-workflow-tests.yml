name: Inquiry workflow offline tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inquiry-workflow/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: inquiry-workflow
      # Excel入出力（#14）と業務ロジック（#15）のテスト。画面の動作テストは pages.yml の Playwright で実行する
      - run: npm test
        working-directory: inquiry-workflow
