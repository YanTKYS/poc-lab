<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PoC Lab</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --fg: #1b1f24;
      --muted: #5b6470;
      --card: #ffffff;
      --border: #d5dae1;
      --accent: #0b57d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans CJK JP", sans-serif;
      line-height: 1.7;
    }
    main { max-width: 860px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .lead { margin: 0 0 24px; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.poc {
      display: block;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
    }
    a.poc:hover, a.poc:focus-visible { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px #0b57d033; }
    .poc-title { display: block; font-weight: bold; color: var(--accent); font-size: 1.1rem; }
    .poc-desc { display: block; color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>PoC Lab</h1>
    <p class="lead">技術検証（PoC）の一覧です。各PoCは独立したフォルダに配置しています。</p>
    <ul>
      <li>
        <a class="poc" href="pele/">
          <span class="poc-title">Pele と Mermaid.js の比較</span>
          <span class="poc-desc">同じMermaid記法を Pele と Mermaid.js で左右に描画し、見た目・描画時間・互換性を比較します。</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
